services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: microloan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microloan_db"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/microloan_db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SPRING_PROFILES_ACTIVE: dev
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: /app/uploads/kyc
      APP_OFFICER_NAME: ${APP_OFFICER_NAME:-}
      APP_OFFICER_EMAIL: ${APP_OFFICER_EMAIL:-}
      APP_OFFICER_PASSWORD: ${APP_OFFICER_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - kyc_uploads:/app/uploads/kyc
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  kyc_uploads:

