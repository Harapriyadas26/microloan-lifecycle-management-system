spring.datasource.url=jdbc:h2:mem:microloan_tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.jwt.secret=test-only-isolated-signing-key-not-for-deployment-1234567890
app.upload.dir=${java.io.tmpdir}/microloan-isolated-tests
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
