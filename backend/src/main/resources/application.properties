spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/microloan_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.upload.dir=${UPLOAD_DIR:uploads/kyc}
# Enable API documentation only for local development.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
